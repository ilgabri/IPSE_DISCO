name: IPSE_DB_env
channels:
  - conda-forge
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r

dependencies:
  - python=3.11

  # Core
  - numpy
  - requests
  - pymongo
  - tabulate

  # Materials / chemistry
  - pymatgen

  # Materials Project API
  - mp-api

  # Pip-only / safer via pip
  - pip
  - pip:
      - qmpy_rester
